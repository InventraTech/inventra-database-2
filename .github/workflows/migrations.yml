name: migrations

on:
  push:
    paths: ['postgre/**', '.github/workflows/migrations.yml']
  pull_request:
    paths: ['postgre/**', '.github/workflows/migrations.yml']

jobs:
  check-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inventra_db
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: inventra_db
    steps:
      - uses: actions/checkout@v4
      - run: bash postgre/tests/check_migrations.sh
      - run: psql -X -q -v ON_ERROR_STOP=1 -f postgre/tests/check_normalization_integrity.sql
      - run: psql -X -q -v ON_ERROR_STOP=1 -f postgre/tests/check_daily_access.sql
      - run: psql -X -q -v ON_ERROR_STOP=1 -f postgre/tests/check_ui_click_counter.sql
      - run: psql -X -q -v ON_ERROR_STOP=1 -f postgre/tests/check_category_hierarchy.sql
      - run: bash postgre/tests/check_backup_restore.sh
      - run: bash postgre/tests/check_dictionary_sync.sh
