name: mongo

on:
  push:
    paths: ['mongo/**', '.github/workflows/mongo.yml']
  pull_request:
    paths: ['mongo/**', '.github/workflows/mongo.yml']

jobs:
  check-mongo:
    # O mongod 8 não sobe em kernel Linux 6.19+ (SERVER-121912) e o ubuntu-latest passou a usar um.
    # Fixado em uma imagem de runner com kernel anterior; voltar para ubuntu-latest quando a MongoDB corrigir.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: uname -r
      # mongosh vem na imagem; o repositório é montado para os scripts rodarem dentro do container
      - run: docker run -d --name mongo -v "$GITHUB_WORKSPACE:/repo" mongo:8
      - run: |
          timeout 60 bash -c 'until docker exec mongo mongosh --quiet --eval "db.adminCommand({ ping: 1 }).ok" > /dev/null 2>&1; do sleep 1; done'
      - run: docker exec mongo bash /repo/mongo/tests/check_migrations.sh
      # sem isto a esteira só mostra "exit code 124" quando o Mongo não sobe
      - if: failure()
        run: |
          docker ps -a
          docker logs mongo
